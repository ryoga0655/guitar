<title>弾き込みノート</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17110D;
    --surface:#241B15;
    --surface-hover:#2E231B;
    --border:#3D2E22;
    --text:#F3E9D5;
    --text-muted:#B8A88C;
    --gold:#CBA135;
    --gold-bright:#E4C566;
    --danger:#C1443A;
    --font-display:'Shippori Mincho', serif;
    --font-body:'Zen Kaku Gothic New', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-tap-highlight-color:transparent;
  }
  button,input,select{font-family:inherit;}
  button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  ::selection{background:var(--gold);color:var(--bg);}
  :focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;}

  .shell{max-width:900px;margin:0 auto;padding:28px 16px 110px;}

  /* header */
  .app-header{display:flex;align-items:flex-start;gap:12px;}
  .app-header .pick-wrap{flex-shrink:0;margin-top:2px;}
  .app-header .head-text{min-width:0;flex:1;}
  .app-title{font-family:var(--font-display);font-size:24px;color:var(--text);margin:0;letter-spacing:0.02em;text-wrap:balance;}
  .app-sub{margin:6px 0 0;color:var(--text-muted);font-size:13px;line-height:1.6;}
  .switch-link{margin-top:8px;display:inline-flex;align-items:center;gap:5px;color:var(--gold);font-size:12px;padding:2px 0;}

  /* profile switcher */
  .profile-list{margin-top:16px;display:flex;flex-direction:column;gap:8px;}
  .profile-list-row{
    display:flex;align-items:center;gap:14px;width:100%;
    padding:12px 14px;border:1px solid var(--border);border-radius:16px;
    background:var(--surface);transition:background .15s,border-color .15s;
    min-height:56px;
  }
  .profile-list-row:hover{background:var(--surface-hover);}
  .profile-list-row.active{border-color:var(--gold);background:rgba(203,161,53,0.08);}
  .profile-avatar{
    flex-shrink:0;width:40px;height:40px;border-radius:50%;border:1.5px solid;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-size:17px;font-weight:700;
  }
  .profile-list-name{flex:1;text-align:left;font-family:var(--font-display);font-size:16px;}
  .profile-check{flex-shrink:0;display:flex;}
  .loading-text{margin-top:36px;color:var(--text-muted);}

  /* toolbar */
  .toolbar{margin-top:24px;display:flex;flex-direction:column;gap:12px;}
  @media (min-width:640px){.toolbar{flex-direction:row;}}
  .search-box{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);}
  .search-box input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;}
  .search-box input::placeholder{color:var(--text-muted);}
  .toolbar-actions{display:flex;align-items:center;gap:8px;}
  .select-field{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font-size:14px;outline:none;}
  @media (min-width:640px){.select-field.sort{flex:none;width:128px;}}
  .btn-gold{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;background:var(--gold);color:var(--bg);font-family:var(--font-display);font-weight:700;font-size:14px;white-space:nowrap;flex-shrink:0;}
  .btn-gold:hover{background:var(--gold-bright);}
  .save-all-btn{width:100%;margin-top:24px;padding:14px;font-size:15px;}

  /* random pick card */
  .random-card{margin-top:16px;border:1px solid var(--border);border-radius:20px;padding:16px;background:var(--surface);}
  .random-title{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:14px;}
  .random-controls{margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .select-field.sm{padding:8px 10px;border-radius:10px;background:var(--bg);font-size:13px;width:auto;}
  .random-sep{color:var(--text-muted);font-size:13px;}
  .btn-gold.sm{margin-left:auto;padding:8px 16px;font-size:13px;border-radius:10px;}
  .random-result{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;}
  .random-result .info{min-width:0;flex:1;}
  .random-result .info p:first-child{font-family:var(--font-display);font-size:16px;margin:0;}
  .random-result .info p:last-child{margin:2px 0 0;color:var(--text-muted);font-size:12px;}
  .yt-pill{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:10px;border:1px solid var(--border);color:var(--gold);font-size:12px;}
  .random-empty{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);color:var(--text-muted);font-size:13px;}

  /* song list */
  .song-list{margin-top:24px;display:flex;flex-direction:column;gap:12px;}
  .list-empty{padding:70px 20px;text-align:center;border:1px solid var(--border);border-radius:20px;}
  .list-empty p:first-child{font-family:var(--font-display);font-size:18px;margin:0;}
  .list-empty p:last-child{margin:8px 0 0;color:var(--text-muted);font-size:13px;}

  /* chords & lyrics */
  .chords-list{margin-top:20px;display:flex;flex-direction:column;gap:10px;}
  .chord-song-row{
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;
    padding:14px 16px;border:1px solid var(--border);border-radius:16px;
    background:var(--surface);text-align:left;transition:background .15s;
  }
  .chord-song-row:hover{background:var(--surface-hover);}
  .chord-song-row .title{font-family:var(--font-display);font-size:15px;max-width:100%;}
  .chord-song-row .artist{font-size:12px;color:var(--text-muted);max-width:100%;}
  .chord-editor-head{display:flex;align-items:center;gap:10px;margin-top:20px;}
  .chord-back-btn{
    flex-shrink:0;width:34px;height:34px;border-radius:10px;border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;background:var(--surface);
  }
  .chord-editor-title{font-family:var(--font-display);font-size:18px;flex:1;min-width:0;margin:0;}
  .chord-editor-hint{margin:12px 0 0;color:var(--text-muted);font-size:12px;line-height:1.7;}
  .chord-editor-wrap{margin-top:12px;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface);}
  .chord-textarea{
    display:block;width:100%;min-height:40vh;border:none;background:transparent;color:var(--text);
    font-family:var(--font-mono);font-size:15px;line-height:2;padding:16px;
    outline:none;resize:vertical;overflow:auto;white-space:pre-wrap;word-break:break-word;
  }
  .chord-textarea::placeholder{color:var(--text-muted);}

  .chev{transition:transform .15s;transform:rotate(0deg);flex-shrink:0;}
  .chev.collapsed{transform:rotate(-90deg);}

  .rank-group{border:1px solid var(--border);border-radius:20px;overflow:hidden;}
  .rank-group-head{width:100%;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);text-align:left;}
  .rank-group-head .name{font-family:var(--font-display);font-size:15px;}
  .rank-group-head .count{color:var(--text-muted);font-size:12px;font-family:var(--font-mono);}
  .rank-group-head .chev{margin-left:auto;}
  .rank-group-body{padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg);}

  .song-card{position:relative;border:1px solid var(--border);border-radius:16px;background:var(--surface);overflow:hidden;}
  .song-card-top{width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;text-align:left;}
  .song-card-info{min-width:0;flex:1;}
  .song-title{font-family:var(--font-display);font-size:15px;margin:0;}
  .song-sub{margin:3px 0 0;color:var(--text-muted);font-size:12px;}
  .mastery-pill{flex-shrink:0;color:var(--text-muted);font-size:11px;font-family:var(--font-mono);}
  .rank-badge{position:relative;flex-shrink:0;display:inline-block;}
  .rank-badge svg{display:block;}
  .rank-badge .label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:var(--bg);}

  .song-card-detail{padding:0 16px 18px;}
  .song-stats{margin-top:0;display:flex;flex-direction:column;gap:6px;}
  .stat-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .stat-row .stat-label{color:var(--text-muted);font-size:12px;}
  .stat-value{display:flex;align-items:center;gap:8px;}
  .stat-level{width:44px;text-align:right;font-size:10.5px;font-family:var(--font-mono);white-space:nowrap;}
  .star-input{display:flex;align-items:center;gap:2px;}
  .star-btn{padding:2px;line-height:0;}

  .mastery{margin-top:14px;}
  .mastery-track{height:4px;border-radius:99px;overflow:hidden;background:var(--border);}
  .mastery-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold-bright));}
  .mastery-label{margin:4px 0 0;text-align:right;color:var(--text-muted);font-family:var(--font-mono);font-size:11px;}

  .song-actions{margin-top:12px;display:flex;align-items:center;justify-content:space-between;}
  .youtube-link{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;color:var(--gold);font-size:12px;}
  .song-actions-icons{display:flex;align-items:center;gap:4px;}
  .icon-btn{padding:6px;border-radius:8px;color:var(--text-muted);}
  .icon-btn:hover{background:var(--surface-hover);}

  .confirm-row{margin-top:12px;display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:12px;}
  .confirm-row span{color:var(--text-muted);}
  .btn-outline{padding:5px 10px;border-radius:8px;border:1px solid var(--border);color:var(--text);font-size:12px;}
  .btn-danger{padding:5px 10px;border-radius:8px;background:var(--danger);color:#fff;font-size:12px;}

  /* ranking tab */
  .ranking-head{margin-top:32px;display:flex;align-items:center;gap:8px;margin-bottom:20px;}
  .ranking-head h2{font-family:var(--font-display);font-size:18px;margin:0;}
  .ranking-list{display:flex;flex-direction:column;gap:12px;}
  .ranking-row{display:flex;align-items:center;gap:16px;border:1px solid var(--border);border-radius:16px;padding:16px;background:var(--surface);}
  .ranking-row.first{border-color:var(--gold);}
  .rank-num{flex-shrink:0;width:36px;height:36px;border-radius:99px;display:flex;align-items:center;justify-content:center;background:var(--border);color:var(--text);font-family:var(--font-display);font-size:16px;font-weight:700;}
  .rank-num.first{background:var(--gold);color:var(--bg);}
  .ranking-row .info{min-width:0;flex:1;}
  .ranking-row .info p:first-child{margin:0;font-family:var(--font-display);font-size:16px;}
  .ranking-row .info p:last-child{margin:2px 0 0;color:var(--text-muted);font-size:12px;}
  .ranking-row .score{flex-shrink:0;display:flex;align-items:center;gap:5px;}
  .ranking-row .score span{color:var(--gold);font-family:var(--font-mono);font-size:18px;font-weight:700;}

  /* bottom nav */
  .bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:900;display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);}
  .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;}
  .bottom-nav button span{font-size:11px;}

  .save-toast{
    position:fixed;left:50%;bottom:82px;transform:translateX(-50%);
    background:var(--gold);color:var(--bg);font-family:var(--font-display);font-size:12px;
    padding:8px 18px;border-radius:99px;box-shadow:0 6px 18px rgba(0,0,0,0.4);
    z-index:1200;pointer-events:none;white-space:nowrap;
  }

  /* modals */
  .modal-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,7,5,0.72);}
  @media (min-width:640px){.modal-overlay{align-items:center;}}
  .modal-sheet{width:100%;border-radius:24px 24px 0 0;padding:24px;background:var(--surface);border:1px solid var(--border);max-height:90vh;overflow-y:auto;}
  @media (min-width:640px){.modal-sheet{max-width:440px;border-radius:16px;}}
  .modal-title{font-family:var(--font-display);font-size:20px;margin:0 0 18px;}

  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{color:var(--text-muted);font-size:12px;}
  .field input{background:transparent;border:none;border-bottom:1px solid var(--border);outline:none;padding:8px 0;color:var(--text);font-size:14px;}
  .field input:focus{border-bottom-color:var(--gold);}
  .field input::placeholder{color:var(--text-muted);}

  .diff-row{display:flex;gap:8px;}
  .diff-btn{flex:1;padding:9px 0;border-radius:12px;border:1px solid var(--border);font-family:var(--font-display);font-weight:700;color:var(--text-muted);background:transparent;}
  .diff-btn.active{color:var(--bg);}

  .form-stars{padding-top:12px;margin-top:6px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:12px;}
  .form-stars > p{margin:6px 0 0;color:var(--text-muted);font-size:12px;}
  .form-star-row{display:flex;align-items:center;justify-content:space-between;}
  .form-star-row .cat-label{font-size:14px;}
  .form-star-row .right{display:flex;align-items:center;gap:8px;}
  .form-star-row .level{width:44px;text-align:right;font-size:11px;font-family:var(--font-mono);}

  .form-error{color:#E08A7D;font-size:13px;margin:12px 0 0;}
  .form-buttons{margin-top:16px;display:flex;gap:8px;}
  .form-buttons button{flex:1;padding:11px 0;border-radius:12px;font-family:var(--font-body);}
  .form-buttons .cancel{border:1px solid var(--border);color:var(--text);}
  .form-buttons .save{background:var(--gold);color:var(--bg);font-family:var(--font-display);font-weight:700;}

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>

<div id="app"></div>

<script>
(function(){
  var COLORS = {
    bg:'#17110D', surface:'#241B15', surfaceHover:'#2E231B', border:'#3D2E22',
    text:'#F3E9D5', textMuted:'#B8A88C', gold:'#CBA135', goldBright:'#E4C566'
  };

  var RANKS = [
    { key:'S', label:'挑戦', color:'#C1443A' },
    { key:'A', label:'練習', color:'#D98A3D' },
    { key:'B', label:'標準', color:'#CBA135' },
    { key:'C', label:'入門', color:'#6E9B7C' },
    { key:'D', label:'簡単', color:'#5C84A6' },
  ];
  var RANK_ORDER = { S:0, A:1, B:2, C:3, D:4 };
  var CATEGORIES = [
    { key:'chords', label:'コード' },
    { key:'stroke', label:'ストローク' },
    { key:'rhythm', label:'リズム' },
    { key:'arpeggio', label:'アルペジオ' },
  ];
  var PROFILES = ['ゆうこ','なつか','りょうが'];
  var PROFILE_COLORS = { 'ゆうこ':'#9B5DE5', 'なつか':'#C1443A', 'りょうが':'#4E9B5C' };
  var LEVEL_NAMES = ['みならい','初級','中級','上級','達人'];
  var OLLIES_CHANNEL_HANDLE = 'olliesdaigo';

  var SEED_SONGS = [
    { id:'seed-marigold', title:'マリーゴールド', artist:'あいみょん', genre:'J-POP', difficulty:'B', chords:4, stroke:4, rhythm:3, arpeggio:2 },
    { id:'seed-aotonatsu', title:'青と夏', artist:'Mrs. GREEN APPLE', genre:'J-POP/ロック', difficulty:'S', chords:0, stroke:0, rhythm:0, arpeggio:0 },
    { id:'seed-ginnoryu', title:'銀の龍の背に乗って', artist:'中島みゆき', genre:'J-POP', difficulty:'S', chords:0, stroke:0, rhythm:0, arpeggio:0 },
    { id:'seed-haikei-shounen', title:'拝啓、少年よ', artist:'Hump Back', genre:'ロック', difficulty:'A', chords:0, stroke:0, rhythm:0, arpeggio:0 },
    { id:'seed-katsushika-rhapsody', title:'葛飾ラプソディー', artist:'堂島孝平', genre:'J-POP', difficulty:'A', chords:0, stroke:0, rhythm:0, arpeggio:0 },
    { id:'seed-chandelier', title:'シャンデリヤ', artist:'THEE MICHELLE GUN ELEPHANT', genre:'ロック', difficulty:'B', chords:0, stroke:0, rhythm:0, arpeggio:0 },
    { id:'seed-cherry', title:'チェリー', artist:'スピッツ', genre:'J-POP/ロック', difficulty:'B', chords:0, stroke:0, rhythm:0, arpeggio:0 },
    { id:'seed-countryroad', title:'カントリー・ロード', artist:'本名陽子', genre:'映画音楽(耳をすませば)', difficulty:'C', chords:0, stroke:0, rhythm:0, arpeggio:0 },
    { id:'seed-soramotoberuhazu', title:'空も飛べるはず', artist:'スピッツ', genre:'J-POP/ロック', difficulty:'C', chords:0, stroke:0, rhythm:0, arpeggio:0 },
    { id:'seed-yorunikakeru', title:'夜に駆ける', artist:'YOASOBI', genre:'J-POP', difficulty:'S', chords:0, stroke:0, rhythm:0, arpeggio:0 },
    { id:'seed-marunouchi-sadistic', title:'丸の内サディスティック', artist:'椎名林檎', genre:'J-POP/ロック', difficulty:'S', chords:0, stroke:0, rhythm:0, arpeggio:0 },
    { id:'seed-himawari-no-yakusoku', title:'ひまわりの約束', artist:'秦基博', genre:'J-POP', difficulty:'A', chords:0, stroke:0, rhythm:0, arpeggio:0 },
  ];

  function levelName(v){ return v ? LEVEL_NAMES[v-1] : '未評価'; }
  function youtubeSearchUrl(title){
    return 'https://www.youtube.com/@' + OLLIES_CHANNEL_HANDLE + '/search?query=' + encodeURIComponent(title);
  }
  function escapeHtml(str){
    return String(str==null?'':str).replace(/[&<>"']/g, function(ch){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch];
    });
  }

  function storageGet(key){
    try { return localStorage.getItem(key); } catch(e){ return null; }
  }
  function storageSet(key, value){
    try { localStorage.setItem(key, value); return true; } catch(e){ return false; }
  }

  var ICONS = {
    pick: function(size, color){
      return '<svg width="'+size+'" height="'+(size*1.14)+'" viewBox="0 0 100 114" style="display:block"><path d="M50,4 C74,4 94,26 94,52 C94,72 82,90 62,104 C56,109 50,112 50,112 C50,112 44,109 38,104 C18,90 6,72 6,52 C6,26 26,4 50,4 Z" fill="'+color+'"/></svg>';
    },
    star: function(size, color, filled){
      return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="'+(filled?color:'none')+'" stroke="'+color+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
    },
    plus: function(size, color){
      return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
    },
    search: function(size, color){
      return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16" y2="16"/></svg>';
    },
    pencil: function(size, color){
      return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5l5 5L8 21H3v-5z"/><path d="M12.5 6.5l5 5"/></svg>';
    },
    trash: function(size, color){
      return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
    },
    chevron: function(size, color){
      return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
    },
    shuffle: function(size, color){
      return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h3.5a3 3 0 0 1 2.5 1.35L15 18a3 3 0 0 0 2.5 1.35H21"/><path d="M17.5 3.5 21 6l-3.5 2.5"/><path d="M17.5 20.5 21 18l-3.5-2.5"/><path d="M3 18h3.5a3 3 0 0 0 2.5-1.35l1-1.5"/></svg>';
    },
    play: function(size, color){
      return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polygon points="10 8 16 12 10 16 10 8" fill="'+color+'" stroke="none"/></svg>';
    },
    home: function(size, color){
      return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>';
    },
    trophy: function(size, color){
      return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 5H4.5a2.2 2.2 0 0 0 0 4.4H6"/><path d="M17 5h2.5a2.2 2.2 0 0 1 0 4.4H17"/><path d="M9.5 14.2V16c0 .5-.4.9-.9 1.1C7.3 17.6 6.7 18.9 6.7 20"/><path d="M14.5 14.2V16c0 .5.4.9.9 1.1 1.3.5 1.9 1.8 1.9 2.9"/><path d="M5 20h14"/></svg>';
    },
    check: function(size, color){
      return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 13 10 18 19 7"/></svg>';
    },
    back: function(size, color){
      return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>';
    },
    note: function(size, color){
      return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
    }
  };

  var state = {
    songs: [],
    profileName: null,
    profileLoaded: false,
    switchingProfile: false,
    activeTab: 'home',
    query: '',
    sortBy: 'new',
    formOpen: false,
    editingSong: null,
    formData: null,
    confirmDeleteId: null,
    collapsedRanks: { S:true, A:true, B:true, C:true },
    expandedSongIds: {},
    chordSongId: null,
    chordDraft: null,
    toastMsg: null,
    randomFrom: 'S',
    randomTo: 'D',
    randomPick: null,
    randomEmpty: false,
    ranking: [],
  };

  function loadSongsForProfile(name){
    var existing = [];
    try {
      var raw = storageGet('songs:' + name);
      existing = raw ? JSON.parse(raw) : [];
    } catch(e){ existing = []; }
    var existingIds = {};
    existing.forEach(function(s){ existingIds[s.id] = true; });
    var toAdd = SEED_SONGS.filter(function(s){ return !existingIds[s.id]; }).map(function(s, i){
      var copy = {}; for (var k in s) copy[k] = s[k];
      copy.createdAt = Date.now() + i;
      return copy;
    });
    var merged = existing.concat(toAdd);
    state.songs = merged;
    if (toAdd.length > 0) storageSet('songs:' + name, JSON.stringify(merged));
  }

  function persistSongs(next){
    state.songs = next;
    if (!state.profileName) return;
    storageSet('songs:' + state.profileName, JSON.stringify(next));
  }

  function selectProfile(name){
    state.profileName = name;
    state.switchingProfile = false;
    loadSongsForProfile(name);
    storageSet('currentProfile', name);
    render();
  }

  function loadRanking(){
    var results = PROFILES.map(function(name){
      try {
        var raw = storageGet('songs:' + name);
        var list = raw ? JSON.parse(raw) : [];
        var total = list.reduce(function(sum, s){
          return sum + (s.chords||0) + (s.stroke||0) + (s.rhythm||0) + (s.arpeggio||0);
        }, 0);
        return { name: name, total: total, songCount: list.length };
      } catch(e){ return { name: name, total: 0, songCount: 0 }; }
    });
    results.sort(function(a,b){ return b.total - a.total; });
    state.ranking = results;
  }

  function setActiveTab(tab){
    state.activeTab = tab;
    if (tab === 'ranking') loadRanking();
    render();
  }

  function toggleRank(key){
    if (state.collapsedRanks[key]) delete state.collapsedRanks[key];
    else state.collapsedRanks[key] = true;
    render();
  }

  function toggleSongExpand(id){
    if (state.expandedSongIds[id]) delete state.expandedSongIds[id];
    else state.expandedSongIds[id] = true;
    render();
  }

  function pickRandomSong(){
    var lo = Math.min(RANK_ORDER[state.randomFrom], RANK_ORDER[state.randomTo]);
    var hi = Math.max(RANK_ORDER[state.randomFrom], RANK_ORDER[state.randomTo]);
    var candidates = state.songs.filter(function(s){
      return RANK_ORDER[s.difficulty] >= lo && RANK_ORDER[s.difficulty] <= hi;
    });
    if (candidates.length === 0){
      state.randomPick = null;
      state.randomEmpty = true;
      render();
      return;
    }
    if (candidates.length > 1 && state.randomPick){
      candidates = candidates.filter(function(s){ return s.id !== state.randomPick.id; });
    }
    var idx = Math.floor(Math.random() * candidates.length);
    state.randomPick = candidates[idx];
    state.randomEmpty = false;
    render();
  }

  function openForm(song){
    state.editingSong = song || null;
    state.formOpen = true;
    state.formData = {
      title: song ? song.title : '',
      artist: song ? song.artist : '',
      genre: song ? song.genre : '',
      difficulty: song ? song.difficulty : '',
      chords: song ? song.chords : 0,
      stroke: song ? song.stroke : 0,
      rhythm: song ? song.rhythm : 0,
      arpeggio: song ? song.arpeggio : 0,
      error: '',
    };
    render();
  }
  function closeForm(){
    state.formOpen = false;
    state.editingSong = null;
    state.formData = null;
    render();
  }
  function submitForm(){
    var fd = state.formData;
    if (!fd.title.trim()){ fd.error = '曲名を入力してください'; render(); return; }
    if (!fd.difficulty){ fd.error = '総合難易度を選んでください'; render(); return; }
    var base = state.editingSong ? state.editingSong : {};
    var payload = {
      id: base.id, createdAt: base.createdAt,
      title: fd.title.trim(), artist: fd.artist.trim(), genre: fd.genre.trim(),
      difficulty: fd.difficulty, chords: fd.chords, stroke: fd.stroke, rhythm: fd.rhythm, arpeggio: fd.arpeggio,
      lyricsChords: base.lyricsChords || '',
    };
    handleSaveSong(payload);
  }
  function handleSaveSong(song){
    var next;
    if (state.editingSong){
      next = state.songs.map(function(s){ return s.id === song.id ? song : s; });
    } else {
      song.id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('id-' + Date.now() + '-' + Math.random().toString(36).slice(2));
      song.createdAt = Date.now();
      next = state.songs.concat([song]);
    }
    persistSongs(next);
    state.formOpen = false;
    state.editingSong = null;
    state.formData = null;
    render();
  }
  function handleDeleteSong(id){
    persistSongs(state.songs.filter(function(s){ return s.id !== id; }));
    state.confirmDeleteId = null;
    render();
  }
  var toastTimerId = null;
  function showSaveToast(){
    state.toastMsg = state.profileName ? state.profileName + 'として保存しました' : '保存しました';
    clearTimeout(toastTimerId);
    toastTimerId = setTimeout(function(){ state.toastMsg = null; render(); }, 1300);
  }
  function handleRateSong(songId, key, value){
    var next = state.songs.map(function(s){
      if (s.id !== songId) return s;
      var copy = {}; for (var k in s) copy[k] = s[k];
      copy[key] = value;
      return copy;
    });
    persistSongs(next);
    showSaveToast();
    render();
  }
  function updateSongChordText(songId, text){
    var next = state.songs.map(function(s){
      if (s.id !== songId) return s;
      var copy = {}; for (var k in s) copy[k] = s[k];
      copy.lyricsChords = text;
      return copy;
    });
    persistSongs(next);
  }
  function renderStarInput(value, size, dataAttrs){
    var html = '<div class="star-input">';
    for (var i = 1; i <= 5; i++){
      var filled = i <= value;
      var nextVal = (i === value) ? 0 : i;
      html += '<button type="button" class="star-btn" ' + dataAttrs + ' data-value="' + nextVal + '" aria-label="' + LEVEL_NAMES[i-1] + '" title="' + LEVEL_NAMES[i-1] + '">' + ICONS.star(size, filled ? COLORS.gold : COLORS.border, filled) + '</button>';
    }
    html += '</div>';
    return html;
  }

  function renderRankBadge(rankKey, size){
    var rank = null;
    for (var i = 0; i < RANKS.length; i++) if (RANKS[i].key === rankKey) rank = RANKS[i];
    if (!rank) rank = RANKS[2];
    return '<div class="rank-badge" style="width:' + size + 'px;height:' + (size*1.14) + 'px">' +
      ICONS.pick(size, rank.color) +
      '<span class="label" style="font-size:' + (size*0.4) + 'px;padding-bottom:' + (size*0.16) + 'px">' + rank.key + '</span></div>';
  }

  function renderSongCard(song){
    var expanded = !!state.expandedSongIds[song.id];
    var mastery = Math.round(((song.chords + song.stroke + song.rhythm + song.arpeggio) / 20) * 100);
    var confirming = state.confirmDeleteId === song.id;
    var top = '<button class="song-card-top" data-action="toggle-song" data-id="' + song.id + '">' +
      renderRankBadge(song.difficulty, 36) +
      '<div class="song-card-info">' +
      '<h3 class="song-title truncate">' + escapeHtml(song.title) + '</h3>' +
      '<p class="song-sub truncate">' + escapeHtml(song.artist) + (song.genre ? ' ・ ' + escapeHtml(song.genre) : '') + '</p>' +
      '</div>' +
      '<span class="mastery-pill">' + mastery + '%</span>' +
      '<span class="chev' + (expanded ? '' : ' collapsed') + '">' + ICONS.chevron(16, COLORS.textMuted) + '</span>' +
      '</button>';
    if (!expanded){
      return '<div class="song-card">' + top + '</div>';
    }
    var statsHtml = CATEGORIES.map(function(c){
      return '<div class="stat-row"><span class="stat-label">' + c.label + '</span>' +
        '<div class="stat-value"><span class="stat-level" style="color:' + (song[c.key] ? COLORS.gold : COLORS.textMuted) + '">' + levelName(song[c.key]) + '</span>' +
        renderStarInput(song[c.key], 16, 'data-action="card-rate" data-id="' + song.id + '" data-key="' + c.key + '"') +
        '</div></div>';
    }).join('');
    var actionsHtml;
    if (!confirming){
      actionsHtml = '<div class="song-actions">' +
        '<a class="youtube-link" href="' + youtubeSearchUrl(song.title) + '" target="_blank" rel="noopener noreferrer">' + ICONS.play(15, COLORS.gold) + '<span>参考音源</span></a>' +
        '<div class="song-actions-icons">' +
        '<button class="icon-btn" data-action="edit-song" data-id="' + song.id + '" aria-label="編集">' + ICONS.pencil(15, COLORS.textMuted) + '</button>' +
        '<button class="icon-btn" data-action="delete-song" data-id="' + song.id + '" aria-label="削除">' + ICONS.trash(15, COLORS.textMuted) + '</button>' +
        '</div></div>';
    } else {
      actionsHtml = '<div class="confirm-row"><span>削除しますか?</span>' +
        '<button class="btn-outline" data-action="cancel-delete">キャンセル</button>' +
        '<button class="btn-danger" data-action="confirm-delete" data-id="' + song.id + '">削除</button></div>';
    }
    return '<div class="song-card expanded">' + top +
      '<div class="song-card-detail">' +
      '<div class="song-stats">' + statsHtml + '</div>' +
      '<div class="mastery"><div class="mastery-track"><div class="mastery-fill" style="width:' + mastery + '%"></div></div>' +
      '<p class="mastery-label">習熟度 ' + mastery + '%</p></div>' +
      actionsHtml + '</div></div>';
  }

  // Katakana -> hiragana so search doesn't care which kana the user or the
  // song title happens to use (e.g. "かんとりーろーど" finds "カントリーロード").
  function toHiragana(str){
    return str.replace(/[ァ-ヶ]/g, function(ch){
      return String.fromCharCode(ch.charCodeAt(0) - 0x60);
    });
  }
  function normalizeSearch(str){
    return toHiragana(String(str || '').toLowerCase());
  }
  function getFiltered(){
    var q = normalizeSearch(state.query.trim());
    return state.songs.filter(function(s){
      if (!q) return true;
      return normalizeSearch(s.title).indexOf(q) >= 0 ||
        normalizeSearch(s.artist).indexOf(q) >= 0 ||
        normalizeSearch(s.genre || '').indexOf(q) >= 0;
    });
  }

  function getGrouped(){
    var filtered = getFiltered();
    return RANKS.map(function(r){
      var items = filtered.filter(function(s){ return s.difficulty === r.key; }).slice();
      items.sort(function(a,b){
        if (state.sortBy === 'name') return a.title.localeCompare(b.title, 'ja');
        return b.createdAt - a.createdAt;
      });
      return { rank: r, items: items };
    }).filter(function(g){ return g.items.length > 0; });
  }

  function renderHomeTab(){
    var grouped = getGrouped();
    var listHtml;
    if (grouped.length === 0){
      listHtml = '<div class="list-empty"><p>' + (state.songs.length === 0 ? 'まだ曲が登録されていません' : '一致する曲が見つかりません') + '</p>' +
        '<p>' + (state.songs.length === 0 ? '曲が登録されると、ここに一覧が表示されます' : '検索キーワードを変えてみてください') + '</p></div>';
    } else {
      listHtml = grouped.map(function(g){
        var collapsed = !!state.collapsedRanks[g.rank.key];
        var body = collapsed ? '' : '<div class="rank-group-body">' + g.items.map(renderSongCard).join('') + '</div>';
        return '<div class="rank-group">' +
          '<button class="rank-group-head" data-action="toggle-rank" data-key="' + g.rank.key + '">' +
          renderRankBadge(g.rank.key, 32) +
          '<span class="name">' + g.rank.label + '</span>' +
          '<span class="count">' + g.items.length + '曲</span>' +
          '<span class="chev' + (collapsed ? ' collapsed' : '') + '">' + ICONS.chevron(16, COLORS.textMuted) + '</span>' +
          '</button>' + body + '</div>';
      }).join('');
    }

    var randomResult = '';
    if (state.randomPick){
      randomResult = '<div class="random-result">' + renderRankBadge(state.randomPick.difficulty, 40) +
        '<div class="info"><p class="truncate">' + escapeHtml(state.randomPick.title) + '</p><p class="truncate">' + escapeHtml(state.randomPick.artist) + '</p></div>' +
        '<a class="yt-pill" href="' + youtubeSearchUrl(state.randomPick.title) + '" target="_blank" rel="noopener noreferrer">' + ICONS.play(15, COLORS.gold) + '<span>参考音源</span></a></div>';
    } else if (state.randomEmpty){
      randomResult = '<p class="random-empty">この範囲に登録されている曲がありません</p>';
    }

    var rankOptions = RANKS.map(function(r){ return '<option value="' + r.key + '">' + r.label + '(' + r.key + ')</option>'; }).join('');

    return '<div class="toolbar">' +
      '<div class="search-box">' + ICONS.search(16, COLORS.textMuted) +
      '<input id="search-input" value="' + escapeHtml(state.query) + '" placeholder="曲名・アーティスト・ジャンルで検索"></div>' +
      '<div class="toolbar-actions">' +
      '<select id="sort-select" class="select-field sort">' +
      '<option value="new"' + (state.sortBy==='new'?' selected':'') + '>追加順</option>' +
      '<option value="name"' + (state.sortBy==='name'?' selected':'') + '>名前順</option>' +
      '</select>' +
      '</div></div>' +

      '<div class="random-card"><div class="random-title">' + ICONS.shuffle(16, COLORS.gold) + '<span>今日の1曲をランダムに選ぶ</span></div>' +
      '<div class="random-controls">' +
      '<select id="random-from" class="select-field sm">' + rankOptions + '</select>' +
      '<span class="random-sep">〜</span>' +
      '<select id="random-to" class="select-field sm">' + rankOptions + '</select>' +
      '<button class="btn-gold sm" data-action="pick-random">' + ICONS.shuffle(14, COLORS.bg) + '<span>選ぶ</span></button>' +
      '</div>' + randomResult + '</div>' +

      '<div class="song-list">' + listHtml + '</div>' +

      '<button class="btn-gold save-all-btn" data-action="save-all">' + ICONS.check(16, COLORS.bg) + '<span>すべて保存</span></button>';
  }

  function renderChordsTab(){
    if (!state.chordSongId){
      state.chordDraft = null;
      if (state.songs.length === 0){
        return '<div class="list-empty"><p>まだ曲が登録されていません</p>' +
          '<p>曲が登録されると、ここでコードと歌詞を書き込めます</p></div>';
      }
      var rows = state.songs.map(function(s){
        return '<button class="chord-song-row" data-action="open-chord-song" data-id="' + s.id + '">' +
          '<span class="title truncate">' + escapeHtml(s.title) + '</span>' +
          '<span class="artist truncate">' + escapeHtml(s.artist || '') + '</span>' +
          '</button>';
      }).join('');
      return '<div class="chords-list">' + rows + '</div>';
    }
    var song = null;
    for (var i = 0; i < state.songs.length; i++) if (state.songs[i].id === state.chordSongId) song = state.songs[i];
    if (!song){ state.chordSongId = null; state.chordDraft = null; return renderChordsTab(); }
    if (state.chordDraft === null) state.chordDraft = song.lyricsChords || '';
    var placeholder = 'C           G           Am          F\nここに歌詞を入力していきます';
    return '<div class="chord-editor-head">' +
      '<button class="chord-back-btn" data-action="close-chord-song" aria-label="曲一覧に戻る">' + ICONS.back(16, COLORS.textMuted) + '</button>' +
      '<h2 class="chord-editor-title truncate">' + escapeHtml(song.title) + '</h2>' +
      '<button class="chord-back-btn" data-action="clear-chord-text" aria-label="テキストをクリア" title="テキストをクリア">' + ICONS.trash(16, COLORS.textMuted) + '</button>' +
      '</div>' +
      '<p class="chord-editor-hint">1行目にコード、2行目に歌詞を書くと位置が揃います。書き終えたら下の「保存」を押してください。</p>' +
      '<div class="chord-editor-wrap"><textarea id="chord-textarea" class="chord-textarea" spellcheck="false" placeholder="' + escapeHtml(placeholder) + '">' + escapeHtml(state.chordDraft) + '</textarea></div>' +
      '<button class="btn-gold save-all-btn" data-action="save-chord-text" data-id="' + song.id + '">' + ICONS.check(16, COLORS.bg) + '<span>保存</span></button>';
  }

  function renderRankingTab(){
    if (!state.ranking.length) loadRanking();
    var rows = state.ranking.map(function(r, i){
      var first = i === 0;
      return '<div class="ranking-row' + (first?' first':'') + '">' +
        '<div class="rank-num' + (first?' first':'') + '">' + (i+1) + '</div>' +
        '<div class="info"><p>' + escapeHtml(r.name) + '</p><p>' + r.songCount + '曲登録</p></div>' +
        '<div class="score">' + ICONS.star(16, COLORS.gold, true) + '<span>' + r.total + '</span></div></div>';
    }).join('');
    return '<div class="ranking-head">' + ICONS.trophy(18, COLORS.gold) + '<h2>★獲得数ランキング</h2></div>' +
      '<div class="ranking-list">' + rows + '</div>';
  }

  function renderFormModal(){
    if (!state.formOpen) return '';
    var fd = state.formData;
    var diffButtons = RANKS.map(function(r){
      var active = fd.difficulty === r.key;
      return '<button type="button" class="diff-btn' + (active?' active':'') + '" data-action="form-difficulty" data-rank="' + r.key + '" title="' + r.label + '" style="' + (active ? ('border-color:'+r.color+';background:'+r.color) : '') + '">' + r.key + '</button>';
    }).join('');
    var starFields = CATEGORIES.map(function(c){
      return '<div class="form-star-row"><span class="cat-label">' + c.label + '</span>' +
        '<div class="right"><span class="level" style="color:' + (fd[c.key] ? COLORS.gold : COLORS.textMuted) + '">' + levelName(fd[c.key]) + '</span>' +
        renderStarInput(fd[c.key], 22, 'data-action="form-rate" data-key="' + c.key + '"') + '</div></div>';
    }).join('');
    return '<div class="modal-overlay" data-action="overlay-close" data-target="form">' +
      '<div class="modal-sheet" data-stop="1">' +
      '<h2 class="modal-title">' + (state.editingSong ? '曲を編集' : '曲を登録') + '</h2>' +
      '<div class="field"><label>曲名</label><input id="form-title" value="' + escapeHtml(fd.title) + '" placeholder="例: マリーゴールド"></div>' +
      '<div class="field" style="margin-top:14px"><label>アーティスト</label><input id="form-artist" value="' + escapeHtml(fd.artist) + '" placeholder="例: あいみょん"></div>' +
      '<div class="field" style="margin-top:14px"><label>ジャンル</label><input id="form-genre" value="' + escapeHtml(fd.genre) + '" placeholder="例: J-POP、弾き語り"></div>' +
      '<div style="margin-top:14px"><label style="display:block;margin-bottom:8px;color:' + COLORS.textMuted + ';font-size:12px;">総合難易度</label><div class="diff-row">' + diffButtons + '</div></div>' +
      '<div class="form-stars"><p>仕上がり具合(みならい〜達人)</p>' + starFields + '</div>' +
      (fd.error ? '<p class="form-error">' + escapeHtml(fd.error) + '</p>' : '') +
      '<div class="form-buttons"><button class="cancel" data-action="form-cancel">キャンセル</button>' +
      '<button class="save" data-action="form-submit">保存</button></div>' +
      '</div></div>';
  }

  function renderProfileModal(){
    if (!state.switchingProfile) return '';
    var rows = PROFILES.map(function(name){
      var active = name === state.profileName;
      var color = PROFILE_COLORS[name] || COLORS.gold;
      return '<button class="profile-list-row' + (active?' active':'') + '" data-action="select-profile" data-name="' + escapeHtml(name) + '">' +
        '<span class="profile-avatar" style="background:' + color + '22;border-color:' + color + ';color:' + color + '">' + escapeHtml(name.charAt(0)) + '</span>' +
        '<span class="profile-list-name">' + escapeHtml(name) + '</span>' +
        (active ? '<span class="profile-check">' + ICONS.check(18, color) + '</span>' : '') +
        '</button>';
    }).join('');
    return '<div class="modal-overlay" data-action="overlay-close" data-target="profile">' +
      '<div class="modal-sheet" data-stop="1">' +
      '<h2 class="modal-title" style="margin-bottom:4px">ユーザーを切り替え</h2>' +
      '<p style="margin:0 0 16px;color:' + COLORS.textMuted + ';font-size:12px;">選んだ人ごとに記録が分かれています</p>' +
      '<div class="profile-list">' + rows + '</div>' +
      '<button class="btn-outline" style="width:100%;margin-top:20px;padding:10px 0;border-radius:12px;" data-action="switch-profile-cancel">キャンセル</button>' +
      '</div></div>';
  }

  function render(){
    var html = '<div class="shell">';
    html += '<header class="app-header"><div class="pick-wrap">' + ICONS.pick(36, COLORS.gold) + '</div>' +
      '<div class="head-text"><h1 class="app-title truncate">' + (state.profileName ? escapeHtml(state.profileName) + 'の弾き込みノート' : '弾き込みノート') + '</h1>' +
      '<p class="app-sub">曲ごとの弾き込み具合を、コード・ストローク・リズム・アルペジオの4視点で記録する</p>' +
      (state.profileLoaded && state.profileName ? '<button class="switch-link" data-action="switch-profile-open">' + ICONS.pencil(12, COLORS.gold) + '<span>ユーザーを切り替え</span></button>' : '') +
      '</div></header>';

    if (!state.profileLoaded){
      html += '<p class="loading-text">読み込み中...</p>';
    } else if (state.activeTab === 'home'){
      html += renderHomeTab();
    } else if (state.activeTab === 'chords'){
      html += renderChordsTab();
    } else {
      html += renderRankingTab();
    }
    html += '</div>';

    if (state.profileLoaded && state.profileName){
      html += '<nav class="bottom-nav">' +
        '<button data-action="set-tab" data-tab="home">' + ICONS.home(20, state.activeTab==='home'?COLORS.gold:COLORS.textMuted) + '<span style="color:' + (state.activeTab==='home'?COLORS.gold:COLORS.textMuted) + '">ホーム</span></button>' +
        '<button data-action="set-tab" data-tab="chords">' + ICONS.note(20, state.activeTab==='chords'?COLORS.gold:COLORS.textMuted) + '<span style="color:' + (state.activeTab==='chords'?COLORS.gold:COLORS.textMuted) + '">コード</span></button>' +
        '<button data-action="set-tab" data-tab="ranking">' + ICONS.trophy(20, state.activeTab==='ranking'?COLORS.gold:COLORS.textMuted) + '<span style="color:' + (state.activeTab==='ranking'?COLORS.gold:COLORS.textMuted) + '">ランキング</span></button>' +
        '</nav>';
    }

    html += renderFormModal();
    html += renderProfileModal();
    if (state.toastMsg){
      html += '<div class="save-toast">' + escapeHtml(state.toastMsg) + '</div>';
    }

    document.getElementById('app').innerHTML = html;
  }

  function renderPreserveFocus(){
    var active = document.activeElement;
    var id = active && active.id;
    var selStart = null, selEnd = null;
    if (active && typeof active.selectionStart === 'number'){
      selStart = active.selectionStart; selEnd = active.selectionEnd;
    }
    render();
    if (id){
      var el = document.getElementById(id);
      if (el){
        el.focus();
        if (selStart != null && el.setSelectionRange){
          try { el.setSelectionRange(selStart, selEnd); } catch(e){}
        }
      }
    }
  }

  var app = document.getElementById('app');

  app.addEventListener('click', function(e){
    var target = e.target.closest('[data-action]');
    if (!target) return;
    var action = target.dataset.action;

    if (action === 'select-profile'){ selectProfile(target.dataset.name); return; }
    if (action === 'switch-profile-open'){ state.switchingProfile = true; render(); return; }
    if (action === 'switch-profile-cancel'){ state.switchingProfile = false; render(); return; }
    if (action === 'overlay-close'){
      if (e.target !== target) return;
      if (target.dataset.target === 'form') closeForm();
      else { state.switchingProfile = false; render(); }
      return;
    }
    if (action === 'set-tab'){ setActiveTab(target.dataset.tab); return; }
    if (action === 'toggle-rank'){ toggleRank(target.dataset.key); return; }
    if (action === 'toggle-song'){ toggleSongExpand(target.dataset.id); return; }
    if (action === 'open-chord-song'){ state.chordSongId = target.dataset.id; state.chordDraft = null; render(); return; }
    if (action === 'close-chord-song'){ state.chordSongId = null; state.chordDraft = null; render(); return; }
    if (action === 'clear-chord-text'){ state.chordDraft = ''; render(); return; }
    if (action === 'save-chord-text'){ updateSongChordText(target.dataset.id, state.chordDraft); showSaveToast(); render(); return; }
    if (action === 'save-all'){ persistSongs(state.songs); showSaveToast(); render(); return; }
    if (action === 'pick-random'){ pickRandomSong(); return; }
    if (action === 'edit-song'){
      var song = null;
      for (var i=0;i<state.songs.length;i++) if (state.songs[i].id === target.dataset.id) song = state.songs[i];
      openForm(song);
      return;
    }
    if (action === 'delete-song'){ state.confirmDeleteId = target.dataset.id; render(); return; }
    if (action === 'confirm-delete'){ handleDeleteSong(target.dataset.id); return; }
    if (action === 'cancel-delete'){ state.confirmDeleteId = null; render(); return; }
    if (action === 'card-rate'){
      handleRateSong(target.dataset.id, target.dataset.key, parseInt(target.dataset.value, 10));
      return;
    }
    if (action === 'form-rate'){
      state.formData[target.dataset.key] = parseInt(target.dataset.value, 10);
      render();
      return;
    }
    if (action === 'form-difficulty'){
      state.formData.difficulty = target.dataset.rank;
      state.formData.error = '';
      render();
      return;
    }
    if (action === 'form-cancel'){ closeForm(); return; }
    if (action === 'form-submit'){ submitForm(); return; }
  });

  // IME composition (日本語入力) fires multiple 'input' events while the text is
  // still being converted. Re-rendering (which replaces the DOM node) on those
  // intermediate events breaks the composition mid-keystroke, so we wait for
  // 'compositionend' before applying the value while composing.
  var isComposing = false;
  function handleTextInput(e){
    var id = e.target.id;
    if (id === 'search-input'){ state.query = e.target.value; renderPreserveFocus(); }
    else if (id === 'form-title'){ state.formData.title = e.target.value; renderPreserveFocus(); }
    else if (id === 'form-artist'){ state.formData.artist = e.target.value; renderPreserveFocus(); }
    else if (id === 'form-genre'){ state.formData.genre = e.target.value; renderPreserveFocus(); }
    else if (id === 'chord-textarea'){ state.chordDraft = e.target.value; renderPreserveFocus(); }
  }
  app.addEventListener('compositionstart', function(){ isComposing = true; });
  app.addEventListener('compositionend', function(e){ isComposing = false; handleTextInput(e); });
  app.addEventListener('input', function(e){
    if (isComposing) return;
    handleTextInput(e);
  });

  app.addEventListener('change', function(e){
    var id = e.target.id;
    if (id === 'sort-select'){ state.sortBy = e.target.value; render(); }
    else if (id === 'random-from'){ state.randomFrom = e.target.value; }
    else if (id === 'random-to'){ state.randomTo = e.target.value; }
  });

  (function init(){
    var saved = storageGet('currentProfile');
    var name = (saved && PROFILES.indexOf(saved) >= 0) ? saved : 'りょうが';
    state.profileName = name;
    loadSongsForProfile(name);
    if (!saved) storageSet('currentProfile', name);
    state.profileLoaded = true;
    render();
    // keep the from/to selects in sync with state after first render
    var fromEl = document.getElementById('random-from');
    var toEl = document.getElementById('random-to');
    if (fromEl) fromEl.value = state.randomFrom;
    if (toEl) toEl.value = state.randomTo;
  })();
})();
</script>
